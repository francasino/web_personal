  <line x1="44" y1="22" x2="46" y2="44" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="46" y1="44" x2="22" y2="44" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="22" y1="44" x2="20" y2="20" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="32" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">FC</text>
