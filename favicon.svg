  </defs>
  <rect width="64" height="64" rx="16" fill="#0b0f19" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="20" cy="20" r="4" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="44" cy="22" r="3" fill="#818cf8"/>
  <circle cx="46" cy="44" r="4" fill="#c084fc"/>
  <circle cx="22" cy="44" r="3" fill="#34d399"/>
